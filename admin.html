  <!-- JavaScript for Sidebar -->

  <script>
      const numberUsers = document.getElementById('number2');
      const numberOrders = document.getElementById('number1');
      const totalSales = document.getElementById('number3');


  db.collection('Customers').onSnapshot(snapshot => {
    const totalUsers = snapshot.size; // number of documents in Users
      numberUsers.textContent = totalUsers;
  });


  db.collection('Orders').onSnapshot(snapshot => {
    const totalOrders = snapshot.size; // number of orders
      numberOrders.textContent = totalOrders;

      // Calculate total sales
      let sales = 0;
    snapshot.docs.forEach(doc => {
      const order = doc.data();
      sales += parseFloat(order.price) || 0; // make sure price is a number
    });
      totalSales.textContent = "$" + sales.toFixed(2); // display with 2 decimals
  });

  Promise.all([
    db.collection('WatchesCustomers').get(),
    db.collection('Orders').get()
  ]).then(([customersSnapshot, ordersSnapshot]) => {

    // Create a lookup map: userId -> user info
    const usersMap = {};
    customersSnapshot.docs.forEach(doc => {
      const u = doc.data();
      usersMap[u.userId] = u; // or use email if you prefer
    });

    // Loop through Orders
    ordersSnapshot.docs.forEach(doc => {
      const order = doc.data();
      const user = usersMap[order.userId]; // find user info

      const tr = document.createElement('tr');
      tr.innerHTML = `
      <td>${user ? user.email : '-'}</td>
      <td>${order.productId || '-'}</td>
      <td>${order.productName || '-'}</td>
      <td>₨ ${order.price || 0}</td>
      <td>
        ${order.image ? `<a href="${order.image}" target="_blank">
                          <img src="${order.image}" alt="${order.productName}" style="width:80px; object-fit:contain;">
                        </a>` : '-'}
      </td>
      <td><button onclick="deleteOrder('${doc.id}')">Delete</button></td>
    `;
      ordersTable.appendChild(tr);
    });

  }).catch(err => console.error(err));
  function deleteOrder(id) {
    db.collection('Orders').doc(id).delete()
      .then(() => location.reload())
      .catch(err => console.error(err));
  }

  // Active nav link
  document.querySelectorAll('nav a').forEach(link => {
    if (link.href === window.location.href) {
      link.classList.add('active');
    }
  });

  function showSidebar() {
    document.querySelector('.sidebar').classList.add('show');
  }

  function hideSidebar() {
    document.querySelector('.sidebar').classList.remove('show');
  }
</script>
