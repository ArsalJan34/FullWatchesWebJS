<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>

  <link rel="stylesheet" href="admin.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
</head>

<body>

  <header class="header">
    <a href="#" class="logo">ZEKITH</a>

    <nav class="navbar">
      <a href="#">My Orders</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <section class="info">
    <div class="infobox">
      <h2>Total Orders</h2>
      <p id="totalOrders">0</p>
    </div>

    <div class="infobox">
      <h2>Total Spent</h2>
      <p id="totalSpent">₨ 0</p>
    </div>
  </section>

  <h1>My Orders</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Price</th>
        <th>Image</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="orders"></tbody>
  </table>

  <script>
    const ordersTable = document.getElementById('orders');
    const totalOrdersEl = document.getElementById('totalOrders');
    const totalSpentEl = document.getElementById('totalSpent');

    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      loadUserOrders(user.uid);
    });

    function loadUserOrders(uid) {
      db.collection('Orders')
        .where('userId', '==', uid)
        .orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {

          ordersTable.innerHTML = '';
          totalOrdersEl.textContent = snapshot.size;

          let totalSpent = 0;

          snapshot.forEach(doc => {
            const order = doc.data();
            totalSpent += Number(order.price) || 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td>${order.productId || '-'}</td>
            <td>${order.productName || '-'}</td>
            <td>₨ ${order.price || 0}</td>
            <td>
              ${order.image ? `
                <a href="${order.image}" target="_blank">
                  <img src="${order.image}" style="width:80px; object-fit:contain;">
                </a>` : '-'}
            </td>
            <td>
              ${order.createdAt
                ? order.createdAt.toDate().toLocaleDateString()
                : '-'}
            </td>
          `;

            ordersTable.appendChild(tr);
          });

          totalSpentEl.textContent = `₨ ${totalSpent}`;
        });
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "login.html";
      });
    }
  </script>

</body>

</html>
