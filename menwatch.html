    <!-- Social Media Links -->

  <h1 class="maintext">Men Watches</h1>
  <section class="menwatch">
<div class="card">
  <img src="./images/watch-removebg-preview.png" alt="watch">
  <h3 class="wname">ZEKITH Silver Stainless Steel</h3>
  <h3 class="wgender">Male</h2>
  <div class="price">
    <span class="wprice new-price">₨ 4,999</span>
    <span class="old-price">₨ 6,999</span>

  </div>
  <button class="buy" data-id="prod_001" data-name="ZEKITH Silver Stainless Steel" data-price="4999" data-gender="Male"  data-image="./images/watch-removebg-preview.png"
    onclick="openCartModal(this)">
    Add to cart
  </button>
</div>
<!-- Cart Modal -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeCartModal()">&times;</span>

    <div class="modal-product">
      <img id="modalImage" alt="watch">
      <div>
        <h4 id="modalName"></h4>
        <h4 id="modalGender"></h4>

        <span id="modalPrice"></span>
      </div>
    </div>

    <button onclick="confirmAddToCart()">Confirm Add to Cart</button>
  </div>
</div>

  </section>
  <footer class="footer">
    <div class="footer-content">
      <a href="#" class="logo">ZEKITH</a>
      <div class="f-links">
        <ul>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
      <div class="social-media">
        <a href="#"><i class='bx bxl-twitter'></i></a>
        <a href="#"><i class='bx bxl-facebook-circle'></i></a>
        <a href="#"><i class='bx bxl-instagram-alt'></i></a>
      </div>
    </div>
  </footer>

  <!-- JavaScript for Sidebar -->
  <script>
  let selectedProduct = {};

 function openCartModal(button) {
    selectedProduct.id = button.dataset.id;
    selectedProduct.name = button.dataset.name;
    selectedProduct.price = Number(button.dataset.price);
    selectedProduct.gender = button.dataset.gender;
    selectedProduct.image = button.dataset.image;

    document.getElementById('modalName').innerText = selectedProduct.name;
    document.getElementById('modalGender').innerText = selectedProduct.gender;
    document.getElementById('modalPrice').innerText = `₨ ${selectedProduct.price}`;
    document.getElementById('modalImage').src = selectedProduct.image;

    document.getElementById('cartModal').classList.add('show');
  }
  function confirmAddToCart() {
    const user = auth.currentUser;
    if (!user) {
      alert("Please login first!");
      window.location.href = "../login.html";
      return;
    }

    db.collection('Orders').doc(user.uid + "_" + Date.now()).set({
      productId: selectedProduct.id,
      productName: selectedProduct.name,
      price: selectedProduct.price,
      userId: user.uid,
      createdAt: new Date()
    })
      .then(() => {
        alert("Added to cart 🛒");
        closeCartModal();
      })
      .catch(err => {
        console.error(err);
        alert(err.message);
      });
  }
  function closeCartModal() {
    document.getElementById('cartModal').classList.remove('show');
  }


    function showSidebar() {
      document.querySelector('.sidebar').classList.add('show');
    }

    function hideSidebar() {
      document.querySelector('.sidebar').classList.remove('show');
    }
  </script>

</body>

</html>
